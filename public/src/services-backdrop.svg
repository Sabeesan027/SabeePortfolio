<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="services-bg" x1="960" y1="0" x2="960" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#090A0F" />
      <stop offset="25%" stopColor="#0D1219" />
      <stop offset="70%" stopColor="#090D14" />
      <stop offset="100%" stopColor="#090A0F" />
    </linearGradient>

    <!-- Radial Cyan Glow 1 -->
    <radialGradient id="glow-cyan-left" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 380) scale(460 360)">
      <stop offset="0%" stopColor="#06B6D4" stopOpacity="0.16" />
      <stop offset="50%" stopColor="#06B6D4" stopOpacity="0.05" />
      <stop offset="100%" stopColor="#06B6D4" stopOpacity="0" />
    </radialGradient>

    <!-- Radial Teal Glow 2 -->
    <radialGradient id="glow-teal-right" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1600 680) scale(520 400)">
      <stop offset="0%" stopColor="#14B8A6" stopOpacity="0.14" />
      <stop offset="60%" stopColor="#14B8A6" stopOpacity="0.04" />
      <stop offset="100%" stopColor="#14B8A6" stopOpacity="0" />
    </radialGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="grid-pattern" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1" />
      <!-- Subgrid -->
      <path d="M 20 0 L 20 80 M 40 0 L 40 80 M 60 0 L 60 80 M 0 20 L 80 20 M 0 40 L 80 40 M 0 60 L 80 60" fill="none" stroke="rgba(6, 182, 212, 0.012)" stroke-width="0.5" />
    </pattern>

    <!-- Accent Line Gradient -->
    <linearGradient id="line-cyan-fade" x1="0" y1="0" x2="1920" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="transparent" />
      <stop offset="15%" stopColor="#06B6D4" stopOpacity="0.25" />
      <stop offset="50%" stopColor="#38BDF8" stopOpacity="0.45" />
      <stop offset="85%" stopColor="#14B8A6" stopOpacity="0.25" />
      <stop offset="100%" stopColor="transparent" />
    </linearGradient>
  </defs>

  <!-- Base Studio Fill -->
  <rect width="1920" height="1080" fill="url(#services-bg)" />

  <!-- Ambient Glows -->
  <rect width="1920" height="1080" fill="url(#glow-cyan-left)" />
  <rect width="1920" height="1080" fill="url(#glow-teal-right)" />

  <!-- Architectural Blueprint Grid -->
  <rect width="1920" height="1080" fill="url(#grid-pattern)" />

  <!-- Perspective Horizon & Structural Architectural Framing Lines -->
  <line x1="0" y1="180" x2="1920" y2="180" stroke="url(#line-cyan-fade)" stroke-width="1" />
  <line x1="0" y1="880" x2="1920" y2="880" stroke="url(#line-cyan-fade)" stroke-width="1" />
  <line x1="240" y1="0" x2="240" y2="1080" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" stroke-dasharray="8 8" />
  <line x1="1680" y1="0" x2="1680" y2="1080" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" stroke-dasharray="8 8" />

  <!-- Technical Coordinate Crosshairs (+) -->
  <g stroke="#06B6D4" stroke-opacity="0.35" stroke-width="1.2">
    <path d="M 235 180 H 245 M 240 175 V 185" />
    <path d="M 1675 180 H 1685 M 1680 175 V 185" />
    <path d="M 235 880 H 245 M 240 875 V 885" />
    <path d="M 1675 880 H 1685 M 1680 875 V 885" />
    <path d="M 955 180 H 965 M 960 175 V 185" />
    <path d="M 955 880 H 965 M 960 875 V 885" />
  </g>

  <!-- Technical Wireframe Angle Accent in Corner -->
  <path d="M 80 120 L 140 120 L 140 60" fill="none" stroke="#06B6D4" stroke-opacity="0.2" stroke-width="1.5" />
  <path d="M 1840 120 L 1780 120 L 1780 60" fill="none" stroke="#06B6D4" stroke-opacity="0.2" stroke-width="1.5" />
  <path d="M 80 960 L 140 960 L 140 1020" fill="none" stroke="#14B8A6" stroke-opacity="0.2" stroke-width="1.5" />
  <path d="M 1840 960 L 1780 960 L 1780 1020" fill="none" stroke="#14B8A6" stroke-opacity="0.2" stroke-width="1.5" />
</svg>
