<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="edu-bg" x1="960" y1="0" x2="960" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#090A0F" />
      <stop offset="35%" stopColor="#0B1117" />
      <stop offset="75%" stopColor="#080D14" />
      <stop offset="100%" stopColor="#090A0F" />
    </linearGradient>

    <!-- Radial Teal Glow Left -->
    <radialGradient id="edu-glow-left" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(280 440) scale(480 520)">
      <stop offset="0%" stopColor="#14B8A6" stopOpacity="0.15" />
      <stop offset="60%" stopColor="#14B8A6" stopOpacity="0.04" />
      <stop offset="100%" stopColor="#14B8A6" stopOpacity="0" />
    </radialGradient>

    <!-- Radial Cyan Glow Right -->
    <radialGradient id="edu-glow-right" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1640 620) scale(460 420)">
      <stop offset="0%" stopColor="#06B6D4" stopOpacity="0.12" />
      <stop offset="60%" stopColor="#06B6D4" stopOpacity="0.03" />
      <stop offset="100%" stopColor="#06B6D4" stopOpacity="0" />
    </radialGradient>

    <!-- Architectural Ledger Dot Grid -->
    <pattern id="edu-dot-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="rgba(255, 255, 255, 0.04)" />
    </pattern>

    <!-- Vertical Timeline Spine Beam Gradient -->
    <linearGradient id="edu-spine-glow" x1="0" y1="0" x2="0" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#06B6D4" stopOpacity="0.05" />
      <stop offset="25%" stopColor="#06B6D4" stopOpacity="0.4" />
      <stop offset="65%" stopColor="#38BDF8" stopOpacity="0.35" />
      <stop offset="90%" stopColor="#14B8A6" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#14B8A6" stopOpacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1920" height="1080" fill="url(#edu-bg)" />

  <!-- Ambient Glows -->
  <rect width="1920" height="1080" fill="url(#edu-glow-left)" />
  <rect width="1920" height="1080" fill="url(#edu-glow-right)" />

  <!-- Precision Dot Grid -->
  <rect width="1920" height="1080" fill="url(#edu-dot-grid)" />

  <!-- Vertical Architectural Timeline Ledger Lines -->
  <line x1="360" y1="0" x2="360" y2="1080" stroke="url(#edu-spine-glow)" stroke-width="1.5" />
  <line x1="380" y1="0" x2="380" y2="1080" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1" stroke-dasharray="4 8" />
  <line x1="1560" y1="0" x2="1560" y2="1080" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1" stroke-dasharray="4 8" />

  <!-- Horizontal Milestone Ledger Divisions -->
  <g stroke="rgba(255, 255, 255, 0.035)" stroke-width="1">
    <line x1="180" y1="240" x2="1740" y2="240" stroke-dasharray="6 6" />
    <line x1="180" y1="520" x2="1740" y2="520" stroke-dasharray="6 6" />
    <line x1="180" y1="800" x2="1740" y2="800" stroke-dasharray="6 6" />
  </g>

  <!-- Technical Node Markers -->
  <g fill="none">
    <circle cx="360" cy="240" r="12" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="360" cy="240" r="4" fill="#06B6D4" fill-opacity="0.6" />
    
    <circle cx="360" cy="520" r="12" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="360" cy="520" r="4" fill="#38BDF8" fill-opacity="0.6" />

    <circle cx="360" cy="800" r="12" stroke="#14B8A6" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="360" cy="800" r="4" fill="#14B8A6" fill-opacity="0.6" />
  </g>

  <!-- Architectural Crosshairs & Calibration Marks -->
  <g stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1">
    <path d="M 1555 240 H 1565 M 1560 235 V 245" />
    <path d="M 1555 520 H 1565 M 1560 515 V 525" />
    <path d="M 1555 800 H 1565 M 1560 795 V 805" />
  </g>
</svg>
